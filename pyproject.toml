[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aef-core"
version = "0.1.0"
description = "Agent Engineering Foundation: a repo-agnostic Agent Operating System scaffold"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34,<1"]
mem0 = ["mem0ai>=0.1,<3"]
# Optional: exercises Mem0Adapter against a REAL, fully-local mem0.Memory()
# (fastembed embedder + faiss vector store, zero network calls once the
# embedding model is cached, zero LLM API key actually invoked). Not part
# of the default dev install or CI — opt in with `pip install -e ".[mem0,mem0-integration]"`
# and run tests/services/memory/test_mem0_adapter_integration.py directly.
mem0-integration = ["fastembed>=0.4,<1", "faiss-cpu>=1.8,<2"]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
aef = "aef.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["aef"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
# TID251 (banned-api) enforces vendor-SDK import isolation; see
# scripts/check_vendor_isolation.py / tests/test_vendor_isolation.py for the
# authoritative, path-aware check. This flake8-tidy-imports rule is a coarse
# global backstop only (it cannot express "banned except under providers/").

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Multiple test dirs share basenames (e.g. tests/state/test_schema.py and
# tests/config/test_schema.py); importlib mode keys modules by full path
# instead of colliding on basename, so no __init__.py-per-dir is needed.
addopts = "--import-mode=importlib"
