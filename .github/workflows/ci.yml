name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,mem0]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check aef tests examples

      - name: Type-check (mypy --strict)
        run: mypy aef examples

      - name: Vendor isolation (constraint #3)
        run: pytest tests/test_vendor_isolation.py -v

      - name: Graph-IR schema-compat gate
        run: pytest tests/test_schema_compat.py -v

      - name: Full test suite
        run: pytest -q
