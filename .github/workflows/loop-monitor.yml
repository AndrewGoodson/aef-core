# Post-merge monitoring, auto-rollback, and the weekly digest.
#
# This is the clock. Monitoring windows and the digest need something that
# wakes up, and nothing else in the system does.
#
# Same trigger rule as loop-gate.yml: schedule + manual dispatch only, always
# from main. No pull_request, no pull_request_target — see that file for why,
# and tests/harness/test_workflows.py for the assertion that keeps it true.

name: loop-monitor

on:
  schedule:
    # Hourly: evaluate open monitoring windows and roll back what needs it.
    # The exposure window is the monitoring window, so this is the thing that
    # bounds how long a bad change runs live (ADR 0056).
    - cron: "0 * * * *"
    # Daily cycle — harvest, propose, gate. One candidate per turn.
    - cron: "0 3 * * *"
    # Weekly digest — Q-A4 owner default. Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore loop state
        uses: actions/cache@v4
        with:
          path: ~/.aef-loop-state
          # Run-scoped: actions/cache skips the post-job save on an exact hit,
          # so a constant key froze this state after the first run (ADR 0172).
          key: loop-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            loop-state-${{ github.repository }}-

      # Rollback-by-default: an ambiguous window reverts rather than waiting
      # for more data. Exit 2 means the loop halted — a change every gate
      # passed still regressed, so the gates have a blind spot.
      # Also reports days since the last PROPOSED and the last KEPT/MERGED,
      # and names a cycle that has been running and producing nothing — the
      # metric that would have caught ADR 0165's defect on night two.
      - name: Evaluate windows and roll back
        id: monitor
        run: |
          aef loop monitor --repo . --state ~/.aef-loop-state | tee -a "$GITHUB_STEP_SUMMARY"

      # One turn of the loop. Creates a LOCAL candidate branch and gates it;
      # never pushes, which is why contents:read suffices.
      #
      # `--memory` is NOT optional and its absence is why this step was a
      # no-op every night from the day it was written: with no memory store
      # the cycle printed "no memory store configured: nothing to learn from,
      # no candidate" and exited 0, so a green tick meant nothing had happened
      # (reproduced, ADR 0165). The file lives in the cached state dir so it
      # survives between runs.
      #
      # **It will be empty until something in CI writes runs.** After this fix
      # the nightly cycle says `no admissible failure memory` instead of `no
      # memory store configured` — the truth, and now visible in the step
      # summary. That is an honest no-op, not yet a loop that learns from CI.
      - name: Daily cycle
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          echo "## Nightly cycle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          aef loop cycle --repo . --state ~/.aef-loop-state \
            --workdir "$RUNNER_TEMP/cycle" --module agents.demo.graph \
            --runs ~/.aef-loop-state/runs --corpus corpus \
            --memory ~/.aef-loop-state/memory.jsonl \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo "cycle exit: $status" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 0 = escalated to a human (the normal outcome; Tier-1 is off) and
          # 1 = the candidate was rejected, which is also normal. Only 2 —
          # HALTED, or an invocation the CLI refuses — should fail the job and
          # reach "Surface a halt". Letting exit 1 fail it would have made
          # every ordinary rejection look like an incident.
          if [ "$status" -ge 2 ]; then exit "$status"; fi

      - name: Weekly digest
        if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          aef loop digest --repo . --state ~/.aef-loop-state --runs ~/.aef-loop-state/runs | tee "$GITHUB_STEP_SUMMARY"

      # Q-A5 is only PARTLY answered here. A failed job notifies whoever
      # watches GitHub Actions notifications for this repo, which is better
      # than nothing and worse than a real channel. It still depends on the
      # owner noticing an email. A pager, a Linear ticket, or an SMS hook is
      # the real answer and is NOT configured — recorded as an open question
      # rather than papered over (ADR 0057).
      - name: Surface a halt
        if: failure()
        run: |
          echo "## Self-rewiring loop HALTED" >> "$GITHUB_STEP_SUMMARY"
          aef loop status --repo . --state ~/.aef-loop-state >> "$GITHUB_STEP_SUMMARY" || true
          exit 1
